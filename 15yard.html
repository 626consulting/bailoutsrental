<script>

const bookingForm = document.getElementById('booking-form');
const submitButton = document.getElementById('submit-button');
const formStatus = document.getElementById('form-status');

bookingForm.addEventListener('submit', async function(event) {

    event.preventDefault();

    submitButton.disabled = true;
    submitButton.textContent = 'Sending Request...';

    formStatus.className = 'form-status sending';
    formStatus.textContent = 'Sending your rental request...';

    const formData = new FormData(bookingForm);

    try {

        const response = await fetch(
            'https://formspree.io/f/mzezbzyq',
            {
                method: 'POST',
                body: formData,
                headers: {
                    'Accept': 'application/json'
                }
            }
        );

        if (response.ok) {

            // Record successful lead in Google Analytics
            if (typeof gtag === 'function') {

                gtag('event', 'generate_lead', {
                    lead_source: '15_yard_dumpster'
                });

            }

            // Clear the submitted form
            bookingForm.reset();

            // Show confirmation message
            formStatus.className = 'form-status sending';

            formStatus.innerHTML = `
                <strong>Thank you! Your request has been received.</strong><br>
                BAIL OUT will contact you regarding availability,
                pricing and delivery details.
            `;

            // Update the button
            submitButton.textContent = 'Request Received';
            submitButton.disabled = true;

            // Scroll to confirmation
            formStatus.scrollIntoView({
                behavior: 'smooth',
                block: 'center'
            });

            return;
        }

        let errorMessage =
            'We could not send your request. Please try again or call BAIL OUT at 641-691-8799.';

        try {

            const data = await response.json();

            if (data.errors && data.errors.length) {

                errorMessage = data.errors
                    .map(error => error.message)
                    .join(', ');

            }

        } catch (error) {

            // Keep default error message

        }

        throw new Error(errorMessage);

    } catch (error) {

        formStatus.className = 'form-status error';

        formStatus.textContent =
            error.message ||
            'We could not send your request. Please try again or call BAIL OUT at 641-691-8799.';

        submitButton.disabled = false;

        submitButton.textContent =
            'Submit 15-Yard Booking Request';

    }

});

</script>
